<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/styles/global.css" />
    <link rel="stylesheet" href="src/styles/cadastro.css" />
    <title>TechFood - Cadastro</title>
  </head>
  <body>
    <!-- =====================================================
         MODAL DE BOAS-VINDAS — Aula 9
         Aparece na primeira vez que o cliente acessa.
         display:none — o global.js exibe quando necessário.
         O nome é salvo no sessionStorage — some ao fechar a aba,
         ideal para restaurante: cada sessão é um cliente novo.
    ===================================================== -->
    <header id="topo-loja">
      <h1 id="titulo-site">TechFood - Sabor & Saber</h1>
      <p id="boas-vindas">Carregando...</p>

      <input type="checkbox" id="bt_menu" />
      <label for="bt_menu" id="label-menu" aria-label="Abrir menu"
        >&#9776;</label
      >
      <!--
      MODAL DE CONFIRMAÇÃO — Fechar Conta da Mesa          Aula 9
      Substitui o confirm() nativo do navegador — feio e sem estilo.
      Segue o mesmo padrão visual do #modal-boas-vindas (index.html):
        overlay escuro + cartão branco centralizado.
      display:none — pedidos.js exibe via configurarFecharConta()
      quando o cliente clica em "✔ Fechar Conta da Mesa".
      CSS em global.css (reutilizável em outras páginas futuras).
    -->

    <div id="modal-confirmar-cadastro" style="display: none;">
      <div class="modal-bv-conteudo">
        <h2>Cadastrar</h2>
      </div>
    </div>

      <nav id="menu">
        <ul>
          <li><a href="index.html">Cardápio</a></li>
          <li><a href="pedidos.html">Meus Pedidos</a></li>
          <li><a href="cadastro.html">Cadastrar Prato</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <!-- =====================================================
           Montar o formulário de cadastro com os campos do prato (nome, descrição, preço, categoria e imagem)
      ===================================================== -->
      <section id="secao-cadastro">
        <h2 class="titulo-secao">Cadastro</h2>
        <div class="vitrine-grid" id="grid-cardapio">
          <!-- Preenchido pelo main.js via API -->
        </div>
      </section>
    </main>

    <footer id="rodape">
      <div class="info-footer">
        <p><strong>TechFood 2026</strong></p>
        <p>Escola SENAI Ítalo Bologna - Itu/SP</p>
        <p>Av. das Nações, 1500</p>
      </div>
      <p id="data-hora-footer"></p>
    </footer>

    <!--
      Ordem dos scripts — importante:
      1. global.js → funções compartilhadas (saudação, modal)
      2. api.js    → funções de fetch (main.js depende delas)
      3. main.js   → lógica do cardápio
    -->
    <script src="src/scripts/cadastro.js"></script>
    <script src="src/scripts/global.js"></script>
    <script src="src/scripts/api.js"></script>
    <script src="src/scripts/main.js"></script>
  </body>
</html>

<!doctype html>

<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechFood - Cadastro de Pratos</title>
<link rel="stylesheet" href="src/styles/global.css">
<link rel="stylesheet" href="src/styles/cadastro.css">
</head>
<body>
<header id="topo-loja">
    <h1 id="titulo-site">TechFood - Cadastro de Pratos</h1>
    <p id="boas-vindas">Cadastre novos itens do cardápio</p>
</header>
<main>
<section id="secao-cadastro">
    <h2 class="titulo-secao">Novo Prato</h2>
    <div id="feedback-cadastro"></div>
    <form id="form-cadastro">
        <div class="campo-formulario">
            <label for="input-nome">Nome do prato</label>
            <input
                type="text"
                id="input-nome"
                placeholder="Ex.: Pizza de Calabresa"
            >
            <span
                id="erro-nome"
                class="campo-erro">
            </span>
        </div>
        <div class="campo-formulario">
            <label for="input-descricao">Descrição</label>
            <textarea
                id="input-descricao"
                maxlength="200"
                rows="4"
                placeholder="Descreva o prato">
            </textarea>
            <div id="contador-descricao">
                0 / 200
            </div>
            <span
                id="erro-descricao"
                class="campo-erro">
            </span>
        </div>
        <div class="campo-formulario">
            <label for="input-preco">Preço</label>
            <input
                type="number"
                id="input-preco"
                min="1.00"
                step="1.00" 
                placeholder="0,00"
            >
            <span
                id="erro-preco"
                class="campo-erro">
            </span>
        </div>
        <div class="campo-formulario">
            <label for="select-categoria">Categoria</label>
            <select id="select-categoria">
                <option value="">
                    Selecione uma categoria
                </option>
                <option value="Entradas">
                    Entradas
                </option>
                <option value="Massas">
                    Massas
                </option>
                <option value="Lanches">
                    Lanches
                </option>
                <option value="Pratos Principais">
                    Pratos Principais
                </option>
                <option value="Sobremesas">
                    Sobremesas
                </option>
                <option value="Bebidas">
                    Bebidas
                </option>
            </select>
            <span id="erro-categoria" class="campo-erro">
            </span>
        </div>
        <div class="campo-formulario">
            <label for="input-imagem">
                URL da Imagem
            </label>
            <input type="url" id="input-imagem" placeholder="https://site.com/imagem.jpg">
            <span id="erro-imagem" class="campo-erro">
            </span>
        </div>
        <div id="preview-imagem-container">
            <p>Pré-visualização:</p>
            <img id="preview-imagem" src="" alt="Preview da imagem do prato">
        </div>
        <div class="acoes-formulario">
            <button type="submit" id="btn-salvar-prato">
                Salvar
            </button>
            <button type="button" id="btn-limpar-form">
                Limpar
            </button>
            <button type="button" id="btn-cancelar-form">
                <a href="index.html">Cancelar</a>
            </button>
        </div>
    </form>
</section>
</main>
<footer id="rodape">
      <div class="info-footer">
        <p><strong>TechFood 2026</strong></p>
        <p>Escola SENAI Ítalo Bologna - Itu/SP</p>
        <p>Av. das Nações, 1500</p>
      </div>
      <p id="data-hora-footer"></p>
    </footer>
<script src="src/scripts/global.js"></script>
<script src="src/scripts/api.js"></script>
<script src="src/scripts/cadastro.js"></script>
</body>
</html>
